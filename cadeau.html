<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bon Cadeau</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9e2d8;
      padding: 16px;
    }
    .card {
      max-width: 520px;
      width: 100%;
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/bon-cadeau.png" alt="Bon Cadeau - Atelier modelage et peinture pour Lilia, Céramiques Toulousaines, samedi 3 octobre à 10h, commande n°2596">
  </div>
</body>
</html>
