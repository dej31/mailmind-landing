<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Challenge Halle Back</title>
    <!--
      GitHub Pages sert ce fichier pour toute URL inconnue (ex: une
      navigation directe vers /tournoi/mon-slug). On encode le chemin dans
      la query string et on redirige vers index.html, qui le décode au
      chargement (voir le script correspondant dans index.html) pour que
      React Router puisse reprendre la main normalement.
      Technique standard : https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 1 // 1 pour un projet servi sous /<repo>/, 0 pour un domaine personnalisé
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
